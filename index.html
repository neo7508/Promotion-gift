<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%2316202A%22/%3E%3Crect%20x%3D%22118%22%20y%3D%22150%22%20width%3D%22276%22%20height%3D%2276%22%20rx%3D%2214%22%20fill%3D%22%23D6382B%22/%3E%3Crect%20x%3D%22118%22%20y%3D%22252%22%20width%3D%22276%22%20height%3D%22110%22%20rx%3D%2214%22%20fill%3D%22%23E4D9C3%22/%3E%3Crect%20x%3D%22238%22%20y%3D%22150%22%20width%3D%2236%22%20height%3D%22212%22%20fill%3D%22%2316202A%22/%3E%3C/svg%3E">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css');

:root{
  --ink:#16202A; --ink2:#243444; --ink3:#3B4C5E;
  --paper:#ECEDE8; --surface:#fff; --line:#DCDDD6; --line2:#EBECE6;
  --accent:#D6382B; --accent-d:#A82A20; --accent-w:#FBEBE9;
  --teal:#12594F; --teal-w:#E4EFEC;
  --sand:#E4D9C3; --amber:#B37A12; --amber-w:#FBF1DC;
  --muted:#6B7680; --muted2:#98A0A8;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:var(--paper); color:var(--ink);
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line);
  border-radius:8px; background:var(--surface); outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--ink3);box-shadow:0 0 0 3px rgba(36,52,68,.10)}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.num{font-variant-numeric:tabular-nums}

/* ---------- auth ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:1.05fr .95fr}
.auth-brand{
  background:var(--ink); color:#fff; padding:56px 52px;
  display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
}
.auth-brand:after{
  content:'';position:absolute;right:-90px;bottom:-90px;width:300px;height:300px;
  border-radius:50%;background:var(--accent);opacity:.14;
}
.auth-brand h1{font-size:34px;line-height:1.25;font-weight:800;letter-spacing:-.02em;max-width:12em}
.auth-brand p{color:#9DB0C0;margin-top:16px;max-width:26em;line-height:1.7}
.shelf{display:flex;gap:7px;align-items:flex-end;height:112px;margin-top:36px;position:relative;z-index:1}
.shelf i{flex:1;border-radius:4px 4px 0 0;background:#33465A;display:block}
.shelf i.on{background:var(--sand)}
.shelf i.hot{background:var(--accent)}
.auth-foot{font-size:12.5px;color:#7A8B99;position:relative;z-index:1}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-box{width:100%;max-width:372px}
.auth-box h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.auth-box .sub{color:var(--muted);margin:6px 0 26px}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;
  background:var(--ink);color:#fff;transition:background .13s;
}
.btn:hover{background:var(--ink2)}
.btn.primary{background:var(--accent)}
.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
.btn.full{width:100%;padding:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkline{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}
.linkline b{color:var(--ink);cursor:pointer;font-weight:600}
.linkline b:hover{text-decoration:underline}
.demo{margin-top:24px;padding-top:20px;border-top:1px dashed var(--line)}
.demo p{font-size:12.5px;color:var(--muted2);margin-bottom:9px}
.demo .btns{display:flex;gap:8px}
.demo .btns .btn{flex:1;font-size:13px;padding:8px}

.pending{max-width:430px;text-align:center;padding:40px 30px;background:var(--surface);border-radius:14px;border:1px solid var(--line)}
.pending .mark{width:46px;height:46px;border-radius:50%;background:var(--amber-w);color:var(--amber);display:grid;place-items:center;margin:0 auto 16px;font-size:22px}
.pending h2{font-size:19px;margin-bottom:8px}
.pending p{color:var(--muted);font-size:13.5px;line-height:1.7}

/* ---------- app shell ---------- */
.app{display:none;min-height:100vh;grid-template-columns:236px 1fr}
.app.on{display:grid}
aside{background:var(--ink);color:#C3D0DA;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:9px;padding:0 8px 20px;color:#fff}
.logo .sq{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:800}
.logo b{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.navlabel{font-size:11.5px;color:#61748A;padding:14px 10px 6px}
nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13.5px;cursor:pointer;color:#C3D0DA}
nav a:hover{background:#1F2D3A;color:#fff}
nav a.sel{background:#2A3B4B;color:#fff;font-weight:600}
nav a .ic{width:16px;text-align:center;opacity:.85}
nav a .pill{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:9px}
.me{margin-top:auto;border-top:1px solid #26333F;padding-top:14px;display:flex;gap:9px;align-items:center}
.av{width:32px;height:32px;border-radius:50%;background:#33465A;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.me .nm{font-size:13px;color:#fff;font-weight:600}
.me .rl{font-size:11.5px;color:#7A8B99}
.me .out{margin-left:auto;font-size:12px;color:#7A8B99}
.me .out:hover{color:#fff}

main{padding:26px 30px 60px;max-width:1180px}
.head{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.head h1{font-size:23px;font-weight:700;letter-spacing:-.015em}
.head p{color:var(--muted);font-size:13.5px;margin-top:3px}
.head .sp{margin-left:auto;display:flex;gap:8px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel h3{font-size:14.5px;font-weight:700;padding:14px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.panel h3 .sp{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--muted)}
.pad{padding:16px}

/* per-item stock strip */
.strip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.strip .hd{display:flex;align-items:baseline;gap:8px;padding:11px 15px 0;font-size:13px;font-weight:700}
.strip .hd span{font-weight:400;font-size:12.5px;color:var(--muted)}
.strip .hd .sp{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:400}
.strip .lane{display:flex;gap:0;overflow-x:auto;padding:10px 8px 13px}
.strip .lane::-webkit-scrollbar{height:6px}
.strip .lane::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.chip{flex:none;width:138px;padding:0 15px;border-right:1px solid var(--line2);transition:width .16s}
.chip.out{width:69px;padding:0 9px}
.chip:last-child{border-right:none}
.chip .n{font-size:12.5px;color:var(--muted);line-height:1.35;height:2.7em;overflow:hidden}
.chip .q{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:3px}
.chip .q u{font-size:11.5px;font-weight:500;color:var(--muted);text-decoration:none;margin-left:2px}
.chip .g{height:4px;border-radius:3px;background:#EDEEE9;overflow:hidden;margin-top:6px}
.chip .g i{display:block;height:100%;background:var(--teal)}
.chip.low .q{color:var(--amber)} .chip.low .g i{background:var(--amber)}
.chip.out{opacity:.5} .chip.out .q{color:var(--muted2)} .chip.out .g i{background:var(--line)}
.chip .th{margin-top:8px}
.ph{display:grid;place-items:center;border:1px dashed var(--line);border-radius:6px;background:#F7F8F5;color:var(--muted2);font-size:11px;text-align:center;line-height:1.3}
.up{display:block;cursor:pointer;position:relative}
.up:hover .ph{border-color:var(--ink3);color:var(--ink3);background:var(--line2)}
.up:hover img{outline:2px solid var(--ink3);outline-offset:-2px;border-radius:6px}
.tip{position:fixed;z-index:200;background:var(--ink);color:#fff;padding:7px 11px;border-radius:8px;
  font-size:12.5px;line-height:1.45;max-width:230px;pointer-events:none;opacity:0;transition:opacity .12s;
  box-shadow:0 5px 18px rgba(0,0,0,.24)}
.tip.on{opacity:1}
.tip b{font-weight:700;display:block}
.tip u{text-decoration:none;color:#9DB0C0;font-size:11.5px}
.tip:after{content:'';position:absolute;left:50%;margin-left:-5px;border:5px solid transparent}
.tip.up:after{top:100%;border-top-color:var(--ink)}
.tip.dn:after{bottom:100%;border-bottom-color:var(--ink)}
.thumb{object-fit:cover;border-radius:6px;display:block;background:#F0F1EC;width:100%}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.stat .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.stat.warn{background:var(--accent-w);border-color:#F2CFCB}
.stat.warn .v{color:var(--accent-d)}

/* table */
table{width:100%;border-collapse:collapse;font-size:13.2px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:9px 14px;background:#F7F8F5;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFAF7}
.r{text-align:right}
.c{text-align:center}
.tagset{display:flex;flex-wrap:wrap;gap:4px}
.tag{background:#F0F1EC;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:12px;white-space:nowrap}
.tag b{font-weight:700}
.memo{color:var(--muted);font-size:12.5px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600}
.b-ok{background:var(--teal-w);color:var(--teal)}
.b-wait{background:var(--amber-w);color:var(--amber)}
.b-no{background:var(--accent-w);color:var(--accent-d)}
.b-adm{background:#E7EAEE;color:var(--ink2)}

/* shelf cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:10px}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item .nm{font-weight:700;font-size:14px;letter-spacing:-.01em}
.item .mt{font-size:12px;color:var(--muted);margin-top:2px}
.item .big{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1;text-align:right}
.item .big span{font-size:12px;font-weight:500;color:var(--muted);display:block;margin-top:3px}
.gauge{height:7px;border-radius:4px;background:#EDEEE9;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--teal)}
.gauge.low i{background:var(--amber)}
.gauge.out i{background:var(--accent)}
.item .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.item.zero{opacity:.62}

/* form */
.form{display:grid;gap:14px}
.pick{display:grid;grid-template-columns:1fr 108px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.pick:last-child{border-bottom:none}
.pick .nm{font-size:13.5px;font-weight:600}
.pick .st{font-size:12px;color:var(--muted)}
.pick .st.no{color:var(--accent)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{width:32px;height:34px;background:#F7F8F5;font-size:15px;color:var(--ink3)}
.stepper button:hover{background:var(--line2)}
.stepper input{border:none;border-radius:0;text-align:center;padding:0;height:34px;width:100%;font-variant-numeric:tabular-nums;font-weight:600}
.stepper input:focus{box-shadow:none}
.cart{background:#F7F8F5;border:1px solid var(--line2);border-radius:9px;padding:12px 14px;font-size:13px}
.cart .ln{display:flex;justify-content:space-between;padding:3px 0}
.cart .tot{border-top:1px solid var(--line);margin-top:7px;padding-top:8px;font-weight:700;display:flex;justify-content:space-between}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{width:auto;min-width:150px}
.empty{padding:44px 20px;text-align:center;color:var(--muted2);font-size:13.5px}

.bar{display:flex;align-items:center;gap:10px;padding:7px 0}
.bar .lb{width:88px;font-size:13px;flex:none}
.bar .tr{flex:1;height:16px;background:#F0F1EC;border-radius:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--ink3)}
.bar .vl{width:56px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;font-weight:600}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;font-weight:500;
  opacity:0;pointer-events:none;transition:.22s;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.22)
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ov{position:fixed;inset:0;background:rgba(18,26,34,.45);display:grid;place-items:center;z-index:150;padding:20px}
.modal{background:var(--surface);border-radius:13px;width:100%;max-width:430px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.32);max-height:88vh;overflow-y:auto}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.modal .mh b{font-size:15px}
.modal .mh .x{margin-left:auto;font-size:19px;color:var(--muted2);line-height:1}
.modal .mh .x:hover{color:var(--ink)}
.modal .mh .memo{font-size:12.5px}
.hist{margin-top:15px;border-top:1px solid var(--line2);padding-top:12px}
.hist .hl{display:flex;gap:8px;font-size:12.5px;padding:3px 0}
.now{background:#F7F8F5;border:1px solid var(--line2);border-radius:9px;padding:11px 14px;
  display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.now b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.diff{font-size:13px;font-weight:600;padding:9px 0 0}
.note{background:var(--amber-w);border:1px solid #EBD9AE;color:#7A5306;border-radius:9px;padding:11px 14px;font-size:13px;margin-bottom:16px}

@media(max-width:900px){
  .auth{grid-template-columns:1fr}
  .auth-brand{padding:32px 26px}.auth-brand h1{font-size:26px}.shelf{height:74px}
  .app.on{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;gap:6px;padding:12px}
  .logo{padding:0 8px 0 0}.navlabel{display:none}
  nav{display:flex;gap:4px;overflow-x:auto;flex:1}
  nav a{padding:7px 10px;white-space:nowrap;font-size:13px}
  .me{margin:0;border:none;padding:0}.me .nm,.me .rl{display:none}
  main{padding:18px 14px 50px}
  .stats{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr}
  .split{grid-template-columns:1fr !important}
  table{font-size:12.5px}th,td{padding:8px 10px}
}
.split{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   Supabase 접속 정보
   나중에 프로젝트를 바꾸거나 키를 재발급하면 이 두 줄만 고치면 됩니다.
   publishable key 는 공개돼도 되는 저권한 키입니다.
   sb_secret_ / service_role 로 시작하는 키는 절대 넣지 마세요.

function toast(m){

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ S.me = null; S.loading = false; return render(); }

  const { data:prof, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if(error || !prof){ await sb.auth.signOut(); S.me = null; S.loading = false; return render(); }

  if(prof.status !== 'approved'){
    S.me = null; S.auth = prof.status === 'rejected' ? 'rejected' : 'pending';
    S.loading = false; return render();
  }
  S.me = prof;
  await loadAll();
  S.loading = false;
  render();
}

async function doLogin(){
  const email = ($('lid').value || '').trim();
  const pw    = $('lpw').value || '';
  if(!email || !pw) return toast('이메일과 비밀번호를 입력해주세요');
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if(error) return toast('이메일 또는 비밀번호가 맞지 않습니다');
  S.loading = true; render(); await boot();
}

async function doSignup(){
  const name  = ($('s_name').value || '').trim();
  const email = ($('s_mail').value || '').trim();
  const pw    = $('s_pw').value  || '';
  const pw2   = $('s_pw2').value || '';
  if(!name)            return toast('이름을 입력해주세요');
  if(!email)           return toast('회사 이메일을 입력해주세요');
  if(pw.length < 8)    return toast('비밀번호는 8자 이상이어야 합니다');
  if(pw !== pw2)       return toast('비밀번호가 서로 다릅니다');

  const { error } = await sb.auth.signUp({ email, password: pw, options:{ data:{ name } } });
  if(error) return toast(error.message.includes('already') ? '이미 가입된 이메일입니다' : error.message);
  S.auth = 'pending'; render();
}

async function logout(){ await sb.auth.signOut(); S.me = null; S.auth = 'login'; render(); }

/* ---------------- 데이터 읽기 ---------------- */

async function loadAll(){
  const [it, hd, mv, ad] = await Promise.all([
    sb.from('item_stock').select('*'),
    sb.from('handouts')
      .select('id,handout_date,handler_name,company,memo,user_id,created_at,handout_lines(item_id,qty)')
      .order('handout_date', { ascending:false }).order('id', { ascending:false }).limit(500),
    loadMoves(),
    S.me.role === 'admin'
      ? sb.from('profiles').select('*').order('created_at', { ascending:false })
      : Promise.resolve({ data:[] })
  ]);

  if(it.error) return fail(it.error);

  S.items = (it.data || []).map(r => ({
    id:r.id, name:r.name, price:r.unit_price, loc:r.location, batch:r.batch,
    img:r.image_path, link:r.link, active:r.active,
    buy:r.bought, adj:r.adjusted, out:r.handed_out, stock:r.stock
  })).sort((a,b) => a.name.localeCompare(b.name,'ko'));

  S.logs = (hd.data || []).map(r => ({
    id:r.id, date:r.handout_date, who:r.handler_name, uid:r.user_id,
    comp:r.company, memo:r.memo, created:r.created_at,
    lines:(r.handout_lines || []).map(l => [l.item_id, l.qty])
  }));

  S.moves = mv;
  S.users = ad.data || [];
}

async function loadMoves(){
  const [ins, adj] = await Promise.all([
    sb.from('stock_ins').select('item_id,qty,in_date,memo,profiles:created_by(name)').order('id',{ascending:false}).limit(200),
    sb.from('stock_adjustments').select('item_id,delta,adj_date,reason,profiles:created_by(name)').order('id',{ascending:false}).limit(200)
  ]);
  const a = (ins.data || []).map(r => ({ item:r.item_id, type:'in',  qty:r.qty,   date:r.in_date,  memo:r.memo,   by:r.profiles?.name || '' }));
  const b = (adj.data || []).map(r => ({ item:r.item_id, type:'adj', qty:r.delta, date:r.adj_date, memo:r.reason, by:r.profiles?.name || '' }));
  return [...a, ...b].sort((x,y) => (y.date || '').localeCompare(x.date || ''));
}

async function refresh(){ await loadAll(); render(); }

function thumb(i,h,edit){
  if(i.img) return `<img class="thumb" src="${esc(i.img)}" alt="${esc(i.name)}" style="height:${h}">`;
  return edit ? `<div class="ph" style="height:${h}">＋ 사진</div>` : '';
}
function photoBox(i,h,edit){
  const t = thumb(i,h,edit);
  if(!edit || S.me.role !== 'admin') return t;
  return `<label class="up" title="클릭해서 사진 ${i.img?'변경':'등록'}">${t}
    <input type="file" accept="image/*" hidden onchange="uploadPhoto(this,${i.id})"></label>`;
}

async function uploadPhoto(input, id){
  const f = input.files && input.files[0]; if(!f) return;
  if(!f.type.startsWith('image/')) return toast('이미지 파일만 등록할 수 있습니다');
  if(f.size > 3*1024*1024)         return toast('3MB 이하 이미지만 등록할 수 있습니다');
  try{
    const ext  = (f.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `items/${id}-${Date.now()}.${ext}`;
    const { error:e1 } = await sb.storage.from('item-photos').upload(path, f, { upsert:true });
    if(e1) throw e1;
    const url = sb.storage.from('item-photos').getPublicUrl(path).data.publicUrl;
    const { error:e2 } = await sb.from('items').update({ image_path:url }).eq('id', id);
    if(e2) throw e2;
    await refresh(); toast('제품 사진이 등록됐습니다');
  }catch(e){ fail(e); }
}

function stockStrip(){
  const list = S.items.filter(i => i.active).sort((a,b) => {
    const A = stock(a), B = stock(b);
    if((A===0) !== (B===0)) return A===0 ? 1 : -1;
    return A - B;
  });
  const chips = list.map(i => {
    const s = stock(i), base = i.buy + (i.adj||0), pct = base ? Math.round(s/base*100) : 0;
    const cl = s===0 ? 'out' : s<=15 ? 'low' : '';
    return `<div class="chip ${cl}" data-tip="${esc(i.name)}" data-sub="재고 ${s}개 · 구매 ${i.buy} / 배포 ${i.out} · 보관위치 ${esc(i.loc||'-')}">
      <div class="n">${esc(i.name)}</div>
      <div class="q num">${s}<u>개</u></div>
      <div class="g"><i style="width:${pct}%"></i></div>
      ${i.img ? `<div class="th">${photoBox(i,'56px')}</div>` : ''}
    </div>`;
  }).join('');
  const total = list.reduce((s,i) => s + stock(i), 0);
  if(!list.length) return '';
  return `<div class="strip">
    <div class="hd">품목별 재고 <span>적게 남은 순</span>
      <span class="sp">보유 ${list.filter(i=>stock(i)>0).length}종 · 합계 ${total}개</span></div>
    <div class="lane">${chips}</div>
  </div>`;
}

    <div class="split">

function vNew(){
  const av = S.items.filter(i => i.active && stock(i) > 0);
  const rows = av.map(i => {
    const s = stock(i), q = S.cart[i.id] || 0;
    return `<div class="pick">
      <div><div class="nm">${esc(i.name)}</div><div class="st ${s<=15?'no':''}">재고 ${s}개 · ${esc(i.loc||'-')} · ${won(i.price)}원</div></div>
      <div class="stepper">
        <button onclick="bump(${i.id},-1)">−</button>
        <input class="num" value="${q}" onchange="setq(${i.id},this.value)">
        <button onclick="bump(${i.id},1)">＋</button>
      </div></div>`;
  }).join('');

  const lines = Object.entries(S.cart).filter(([,q]) => q > 0);
  const sum = lines.reduce((s,[id,q]) => s + (item(+id)?.price||0)*q, 0);
  const cnt = lines.reduce((s,[,q]) => s + q, 0);

  return `<div class="head"><div><h1>사용 신청</h1><p>저장하면 재고에서 자동으로 빠집니다.</p></div></div>
    ${stockStrip()}

        <div><label>담당자</label>
          <input value="${esc(S.me.name)}" disabled style="background:#F7F8F5;color:var(--muted)">
          <div class="hint">가입할 때 등록한 이름으로 기록됩니다.</div>
        </div>
        <div><label>비고</label><textarea id="f_memo" rows="2" placeholder="상견례, 설명회 용도 등"></textarea></div>
        <div class="cart">
          ${lines.length ? lines.map(([id,q]) => `<div class="ln"><span>${esc(item(+id).name)} × ${q}</span><span class="num">${won(item(+id).price*q)}원</span></div>`).join('')

function bump(id,d){ const s = stock(item(id)); S.cart[id] = Math.max(0, Math.min(s, (S.cart[id]||0) + d)); render(); }
function setq(id,v){ const s = stock(item(id)); S.cart[id] = Math.max(0, Math.min(s, parseInt(v)||0)); render(); }

async function save(){
  const comp = ($('f_comp').value || '').trim();
  if(!comp) return toast('방문업체를 입력해주세요');
  const lines = Object.entries(S.cart).filter(([,q]) => q > 0).map(([id,q]) => [+id, q]);
  if(!lines.length) return toast('품목을 선택해주세요');

  try{
    const { data:h, error:e1 } = await sb.from('handouts').insert({
      handout_date: $('f_date').value,
      user_id: S.me.id,
      handler_name: S.me.name,
      company: comp,
      memo: ($('f_memo').value || '').trim() || null
    }).select('id').single();
    if(e1) throw e1;

async function delLog(id){
  if(!confirm('이 내역을 삭제하시겠습니까? 차감된 재고가 되돌아갑니다.')) return;
  const { error } = await sb.from('handouts').delete().eq('id', id);
  if(error) return fail(error);
  await refresh(); toast('삭제됐습니다');
}

function exportCSV(){
  const head = ['No.','날짜','담당자','방문업체','품목','수량','비고'];
  const body = [];
  S.logs.forEach(l => l.lines.forEach(([id,q]) =>
    body.push([l.id, l.date, l.who, l.comp, item(id)?.name || '', q, l.memo || ''])));
  const csv = [head, ...body]
    .map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = `판촉물_사용현황_${today()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

/* ---------------- 통계 ---------------- */

function vStats(){
  const byU = {}, byI = {}, byM = {};
  S.logs.forEach(l => {
    const q = l.lines.reduce((a,[,x]) => a+x, 0);
    byU[l.who] = (byU[l.who]||0) + q;
    byM[(l.date||'').slice(0,7)] = (byM[(l.date||'').slice(0,7)]||0) + q;
    l.lines.forEach(([id,x]) => byI[id] = (byI[id]||0) + x);
  });
  const bar = (rows, lab) => {
    const mx = Math.max(...rows.map(r => r[1]), 1);
    return rows.map(r => `<div class="bar"><div class="lb">${esc(lab(r[0]))}</div>
      <div class="tr"><i style="width:${r[1]/mx*100}%"></i></div>
      <div class="vl num">${r[1]}</div></div>`).join('');
  };
  const us = Object.entries(byU).sort((a,b) => b[1]-a[1]);
  const is = Object.entries(byI).sort((a,b) => b[1]-a[1]);
  const ms = Object.entries(byM).sort();
  const cost = S.logs.reduce((s,l) => s + l.lines.reduce((a,[id,q]) => a + (item(id)?.price||0)*q, 0), 0);

  return `<div class="head"><div><h1>통계</h1><p>기간 · 담당자 · 품목별 배포 추이</p></div></div>
    <div class="stats" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat"><div class="k">누적 배포 건수</div><div class="v num">${S.logs.length}<small>건</small></div></div>
      <div class="stat"><div class="k">누적 배포 수량</div><div class="v num">${Object.values(byU).reduce((a,b)=>a+b,0)}<small>개</small></div></div>
      <div class="stat"><div class="k">집행 금액</div><div class="v num">${won(cost)}<small>원</small></div></div>
    </div>
    <div class="split">
      <div class="panel"><h3>담당자별 배포량</h3><div class="pad">${bar(us, n=>n) || '<div class="empty">자료 없음</div>'}</div></div>
      <div class="panel"><h3>월별 추이</h3><div class="pad">${bar(ms, m=>m.slice(5)+'월') || '<div class="empty">자료 없음</div>'}</div></div>
    </div>
    <div class="panel" style="margin-top:14px"><h3>품목별 배포량</h3>
      <div class="pad">${bar(is, id => item(+id)?.name || '') || '<div class="empty">자료 없음</div>'}</div></div>`;
}

let newFile = null;
function previewNew(input){
  const f = input.files && input.files[0]; if(!f) return;
  if(!f.type.startsWith('image/')) return toast('이미지 파일만 등록할 수 있습니다');
  if(f.size > 3*1024*1024)         return toast('3MB 이하 이미지만 등록할 수 있습니다');
  newFile = f;
  const r = new FileReader();
  r.onload = () => { const b = $('n_prev'); if(b) b.innerHTML = `<img class="thumb" src="${r.result}" style="height:84px">`; };
  r.readAsDataURL(f);
}

async function tog(id, active){
  const { error } = await sb.from('items').update({ active }).eq('id', id);
  if(error) return fail(error);
  await refresh();
}

async function addItem(){
  const n = ($('n_name').value||'').trim();
  const p = parseInt($('n_price').value) || 0;
  const b = parseInt($('n_buy').value)   || 0;
  if(!n || !b) return toast('품목명과 구매 수량을 입력해주세요');
  try{
    const { data:it, error:e1 } = await sb.from('items').insert({
      name:n, unit_price:p,
      location:($('n_loc').value||'').trim() || null,
      batch:($('n_batch').value||'').trim() || null,
      link:($('n_link').value||'').trim()   || null,
      created_by:S.me.id
    }).select('id').single();
    if(e1) throw e1;

    const { error:e2 } = await sb.from('stock_ins').insert({
      item_id:it.id, qty:b, unit_price:p, memo:($('n_batch').value||'').trim() || '최초 등록', created_by:S.me.id
    });
    if(e2) throw e2;

    if(newFile){
      const ext  = (newFile.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `items/${it.id}-${Date.now()}.${ext}`;
      const { error:e3 } = await sb.storage.from('item-photos').upload(path, newFile, { upsert:true });
      if(!e3){
        const url = sb.storage.from('item-photos').getPublicUrl(path).data.publicUrl;
        await sb.from('items').update({ image_path:url }).eq('id', it.id);
      }
      newFile = null;
    }
    await refresh(); toast(`'${n}' 품목이 등록됐습니다`);
  }catch(e){ fail(e); }
}

      <div class="hint">사유는 반드시 남겨주세요. 이력에 그대로 기록됩니다.</div>`;

  return `<div class="ov" onclick="if(event.target===this)closeMod()"><div class="modal">
      <div class="mh"><b>${isIn?'입고 추가':'수량 보정'}</b><span class="memo">${esc(i.name)}</span>
        <button class="x" onclick="closeMod()">×</button></div>
      <div class="pad form">${body}${histHTML}</div>
    </div></div>`;
}

function showDiff(cur){
  const v = parseInt($('m_qty').value), d = $('m_diff');
  if(isNaN(v)){ d.style.color = 'var(--muted)'; d.textContent = '숫자를 입력하면 차이가 표시됩니다.'; return; }
  const g = v - cur;
  d.style.color = g===0 ? 'var(--muted)' : g>0 ? 'var(--teal)' : 'var(--accent)';
  d.textContent = g===0 ? '시스템 재고와 같습니다.'
    : `${g>0?'+':''}${g}개 ${g>0?'늘어납니다':'줄어듭니다'} (${cur}개 → ${v}개)`;
}

async function doIn(){
  const i = item(S.modal.id), q = parseInt($('m_qty').value);
  if(!q || q <= 0) return toast('입고 수량을 입력해주세요');
  const pr = parseInt($('m_price').value);
  try{
    const { error } = await sb.from('stock_ins').insert({
      item_id:i.id, qty:q, in_date:$('m_date').value, unit_price:pr>0?pr:null,
      memo:($('m_memo').value||'').trim() || null, created_by:S.me.id
    });
    if(error) throw error;
    if(pr > 0 && pr !== i.price) await sb.from('items').update({ unit_price:pr }).eq('id', i.id);
    closeMod(); await refresh(); toast(`${i.name} ${q}개가 입고 처리됐습니다`);
  }catch(e){ fail(e); }
}

async function doAdj(cur){
  const i = item(S.modal.id), v = parseInt($('m_qty').value), memo = ($('m_memo').value||'').trim();
  if(isNaN(v) || v < 0) return toast('실사 수량을 입력해주세요');
  const g = v - cur;
  if(g === 0)  return toast('시스템 재고와 같아 보정할 내용이 없습니다');
  if(!memo)    return toast('보정 사유를 입력해주세요');
  try{
    const { error } = await sb.from('stock_adjustments').insert({
      item_id:i.id, delta:g, reason:memo, adj_date:today(), created_by:S.me.id
    });
    if(error) throw error;
    closeMod(); await refresh(); toast(`재고를 ${v}개로 보정했습니다`);
  }catch(e){ fail(e); }
}

/* ---------------- 말풍선 ---------------- */

function showTip(el){
  const t = $('tip'), r = el.getBoundingClientRect();
  t.innerHTML = `<b>${esc(el.dataset.tip)}</b><u>${esc(el.dataset.sub||'')}</u>`;
  t.className = 'tip on ' + (r.top < 96 ? 'dn' : 'up');
  t.style.left = Math.min(Math.max(r.left + r.width/2, 120), innerWidth - 120) + 'px';
  t.style.top  = (r.top < 96 ? r.bottom + 9 : r.top - 9) + 'px';
  t.style.transform = r.top < 96 ? 'translate(-50%,0)' : 'translate(-50%,-100%)';
}
function hideTip(){ $('tip').className = 'tip'; }
document.addEventListener('mouseover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if(el) showTip(el); });
document.addEventListener('mouseout',  e => { const el = e.target.closest && e.target.closest('[data-tip]'); if(el) hideTip(); });
addEventListener('scroll', hideTip, true);

/* ---------------- 렌더 ---------------- */

function render(){
  if(S.loading){ $('root').innerHTML = '<div class="empty" style="padding:80px">불러오는 중…</div>'; return; }
  if(!S.me){ $('root').innerHTML = authView(); return; }
  const map = { home:vHome, new:vNew, ledger:vLedger, stock:vStock, stats:vStats, items:vItems, members:vMembers };
  $('root').innerHTML = shell((map[S.view] || vHome)()) + modalView();
}

/* 전역 노출 (인라인 onclick에서 호출) */
Object.assign(window, {
  S, doLogin, doSignup, logout, go, bump, setq, save, delLog, exportCSV,
  tog, addItem, previewNew, uploadPhoto, setStatus, swapRole,
  openMod, closeMod, doIn, doAdj, showDiff, render
});

render();
boot();

</script>
